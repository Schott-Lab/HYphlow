[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyphlow"
version = "1.0.6"
description = "A GUI pipeline for phylogenetic selection analysis with HyPhy"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hyejung Kwon" },
    { name = "Ryan K Schott" }
]
keywords = ["phylogenetics", "selection", "HyPhy", "molecular evolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bioinformatics"
]
requires-python = ">=3.10"
dependencies = [
    "PyQt5",
    "qtawesome",
    "pandas",
    "ete3",
    "rapidfuzz",
    "taxopy",
    "xlsxwriter",
]

[project.urls]
Github = "https://github.com/Schott-Lab/HYphlow"
Issues = "https://github.com/Schott-Lab/HYphlow/issues"

[project.scripts]
hyphlow = "hyphlow.main:main"

[tool.setuptools]
packages = ["hyphlow"]

# data/ holds the organism name list. Without it every species name in a file name reads as a possible gene symbol, and nothing reports that it is missing.
[tool.setuptools.package-data]
"hyphlow" = ["assets/*","data/*.txt.gz]
